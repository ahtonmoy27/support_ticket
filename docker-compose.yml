x-application: &application
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &application-environment
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-support_ticket_sla}
    DB_USERNAME: ${DB_USERNAME:-support_app}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a strong application database password}
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong Redis password}
    REDIS_CLIENT: phpredis
    DB_QUEUE_RETRY_AFTER: 1200
    REDIS_QUEUE_RETRY_AFTER: 1200
  volumes:
    - private-storage:/var/www/html/storage
    - ./docker/php.ini:/usr/local/etc/php/conf.d/support.ini:ro
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *application
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  notifications:
    <<: *application
    command: ["php", "artisan", "queue:work", "--queue=notifications,default", "--tries=3", "--timeout=60"]
  imports:
    <<: *application
    command: ["php", "artisan", "queue:work", "--queue=imports", "--tries=3", "--timeout=900"]
  scheduler:
    <<: *application
    command: ["php", "artisan", "schedule:work"]
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-support_ticket_sla}
      MYSQL_USER: ${DB_USERNAME:-support_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD to a strong distinct root password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  private-storage:
  mysql-data:
  redis-data:
